name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.15']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked runtime
        shell: pwsh
        run: ./scripts/Setup.ps1 -PythonExecutable (Get-Command python).Source
      - name: Test synthetic desktops only
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Read-only soak harness self-test
        shell: pwsh
        run: ./.venv/Scripts/python.exe checks/vnc_soak.py --self-test --source . --duration 2 --interval 0.1 --output checks/results/soak-self-test.json
      - name: Upload synthetic check reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-windows-py${{ matrix.python }}-attempt-${{ github.run_attempt }}
          path: checks/results/
          if-no-files-found: warn
          retention-days: 7

  linux-guest-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install locked runtime
        run: python -m pip install -r requirements.lock.txt && python -m pip install --no-deps -e .
      - name: Verify Linux clipboard process cleanup
        run: python checks/vnc_guest_clipboard.py --source . --output checks/results/linux-guest-clipboard.json
      - name: Upload Linux helper report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-guest-helper-attempt-${{ github.run_attempt }}
          path: checks/results/
          if-no-files-found: warn
          retention-days: 7
