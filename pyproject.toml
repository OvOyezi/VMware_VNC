[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vnc-mcp"
version = "0.4.0"
description = "VNC screen observation and desktop input tools for virtual machines"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shinko" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "mcp==1.30.0",
  "pillow==13.0.0",
  "cryptography==50.0.2",
]

[project.urls]
Repository = "https://github.com/OvOyezi/VMware_VNC"
Issues = "https://github.com/OvOyezi/VMware_VNC/issues"
Changelog = "https://github.com/OvOyezi/VMware_VNC/blob/main/CHANGELOG.md"

[project.scripts]
vnc-mcp = "vnc_mcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vnc_mcp = ["resources/*.ps1", "resources/*.py"]
