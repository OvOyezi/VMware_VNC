[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vmware-vnc"
version = "0.5.0"
description = "MCP tools and an auxiliary CLI for reliable AI visual control of VMware virtual machines"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "mcp==1.30.0",
  "pillow==13.0.0",
  "cryptography==50.0.2",
  "websockets==17.3",
]

[project.urls]
Repository = "https://github.com/OvOyezi/VMware_VNC"
Issues = "https://github.com/OvOyezi/VMware_VNC/issues"
Changelog = "https://github.com/OvOyezi/VMware_VNC/blob/main/CHANGELOG.md"

[project.scripts]
vmware-vnc = "vmware_vnc.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vmware_vnc = ["resources/*.ps1", "resources/*.py"]
